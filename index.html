<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Museum AR</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Member 6 will inject the UI Banner here -->
<div id="statusBanner" class="lost">

    Marker Lost! Point your camera at the Hiro marker.

</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="antialias: true; alpha: true;">
      <!-- Member 2 will inject <a-assets> here -->
      
      <a-marker preset="hiro" id="hiroMarker" emitevents="true">
        <a-text value="Little Space Museum" position="0 1.8 0" align="center" color="#FFFFFF" width="10"></a-text>
        
        <!-- Members 2, 3, 4, and 5 will inject 3D entities here -->
      </a-marker>

      <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>
  </body>
</html>
